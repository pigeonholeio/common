---
openapi: 3.0.0
info:
  title: PigeonHole API
  description: API for Pigeonhole services.
  version: 1.0.0
servers:
  - description: Production server (uses live data)
    url: https://api.pigeonhole.io/v1/
  - description: Localhost Dev
    url: http://localhost:3000/v1/
tags:
  - description: Everything relating to the user
    name: User
  - description: Everything relating to the user auth
    name: Auth
  - description: Endpoints relating to secrets
    name: Secret
  - description: Endpoints relating to OIDC
    name: OIDC
  
x-common-objects:
  commonResponses: &commonResponse
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GeneralMessage'
            type: object
      description: An object containing a common response layout
    # $ref: '#/components/responses/Secrets'
    # description: Successfully retrieved items
    # $ref: '#/components//GeneralMessageResponse'
  commonResonseErrors: &commonErrors
    '400': *commonResponse
    '401': *commonResponse
    '403': *commonResponse
    '404': *commonResponse
    '500': *commonResponse
  
components:
  responses:
    GeneralMessageWithSecretEnvelopeResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SecretEnvelopeResponse'
      description: A Secret object
    Secret:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Secret'
      description: A Secret object
    Key:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Key'
      description: A Key object
    Keys:
      content:
        application/json:
          schema:
            items:
              $ref: '#/components/schemas/Key'
            type: array
      description: An array of Key objects
    Secrets:
      content:
        application/json:
          schema:
            items:
              $ref: '#/components/schemas/Secret'
            type: array
      description: Secret Response object
    GeneralMessageWithOIDCProvidersResponse:
      description: General Message Response
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GeneralMessage'
            - type: object
              properties:
                oidcProviders:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/OIDCProvider'


            - type: object
              properties:
                default:
                  type: string
    GeneralMessageWithKeysResponse:
      description: General Message Response
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GeneralMessage'
            - type: object
              properties:
                keys:
                  type: array
                  items:
                    $ref: '#/components/schemas/Key'
    GeneralMessageResponse:
      description: General Message Response
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GeneralMessage'
    QuotaExceededResponse:
      description: Quota Exceeded Error Response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuotaExceededError'
    GeneralMessageWithDownloadResponse:
      description: General Message Response with Download URL
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GeneralMessage'
            - type: object
              properties:
                downloadUrl:
                  type: string
                secretReference:
                  type: string
                recipientKeyFingerprint:
                  type: string
                  nullable: true
    GeneralMessageWithKeyResponse:
      description: General Message Response
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GeneralMessage'
            - type: object
              properties:
                keys:
                  type: array
                  items:
                    $ref: '#/components/schemas/Key'
    GeneralMessageWithServerInfoResponse:
      description: General Message Response with Users 
      content:
        application/json:
          schema:
            allOf:
            - type: object
              properties:
                version:
                  type: string
    GeneralMessageWithUserResponse:
      description: General Message Response with Users 
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GeneralMessage'
            - type: object
              properties:
                user:
                  $ref: '#/components/schemas/User'
    GeneralMessageWithUsersResponse:
      description: General Message Response with Users
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GeneralMessage'
            - type: object
              properties:
                users:
                  type: array
                  items:
                    $ref: '#/components/schemas/User'
    GeneralMessageWithSecretResponse:
      description: General Message Response
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GeneralMessage'
            - type: object
              properties:
                secret:
                  $ref: '#/components/schemas/Secret'
    GeneralMessageWithSecretsResponse:
      description: General Message Response
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GeneralMessage'
            - type: object
              properties:
                secrets:
                  type: array
                  items:
                    $ref: '#/components/schemas/Secret'
  
            # $ref: '#/components/schemas/GeneralResponse'

          # schema:
          #   $ref: '#/components/schemas/GeneralMessageWithUserResponse'
    GeneralMessageWithTokenResponse:
      description: General Message Response with the PigeonHole JWT Access Token
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GeneralMessage'
            - $ref: '#/components/schemas/Token'
    User:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
      description: A User object
    Users:
      content:
        application/json:
          schema:
            items:
              $ref: '#/components/schemas/User'
            type: array
      description: An array of User objects
  schemas:
    GeneralMessageWithUserResponse:
      type: object
      properties:
        fields:
          type: object
          properties:
            message:
              type: string
            user:
              $ref: '#/components/schemas/User'
    OIDCProviderToken:
      description: This is used to pass the IdP issued id/access token to exchange it for a PigeonHole access token
      type: object
      properties:
        accessToken:
          type: string
          nullable: false
        audience:
          type: string
          nullable: true
    OIDCProvider:
      type: object
      properties:
        name:
          type: string
          nullable: false
        handlerUrl:
          type: string
          nullable: true
        userInfoUrl:
          type: string
          nullable: true
        authUrl:
          type: string
          nullable: false
        tokenUrl:
          type: string
          nullable: false
        deviceAuthURL:
          type: string
          nullable: false
        clientID:
          type: string
          nullable: false
        scopes:
          type: array
          nullable: false
          items:
            type: string
        audience:
          type: string
          nullable: true
        # tokenHandlerEndpoint:
        #   type: string
        #   nullable: false
        
    SecretEnvelopeResponse:
      type: object
      properties:
        expiration:
          type: string
          format: date-time
        onetime:
          type: boolean
        s3_info:
          type: object
          properties:
            fields:
              type: object
              properties:
                key:
                  type: string
                policy:
                  type: string
                x-amz-algorithm:
                  type: string
                x-amz-credential:
                  type: string
                x-amz-date:
                  type: string
                x-amz-meta-recipient_ids:
                  type: array
                  items:
                    type: string
                x-amz-meta-sender_id:
                  type: string
                x-amz-meta-reference:
                  type: string
                x-amz-signature:
                  type: string
            url:
              type: string
              format: uri
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    CreateSecretResponse:
      type: object
      properties:
        s3_info:
          type: object
          properties:
            fields:
              type: object
              properties:
                key:
                  type: string
                policy:
                  type: string
                x-amz-algorithm:
                  type: string
                x-amz-credential:
                  type: string
                x-amz-date:
                  type: string
                x-amz-meta-recipient_ids:
                  type: array
                  items:
                    type: string
                x-amz-meta-sender_id:
                  type: string
                x-amz-meta-reference:
                  type: string
                x-amz-signature:
                  type: string
            url:
              type: string
              format: uri
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    CreateSecretEnvelopeOptions:
      properties:
        recipient_ids:
          description: A list of recipient IDs.
          items:
            type: string
          type: array
        reference:
          description: A reference string for the secret.
          type: string
        ephemeralkeys:
          description: A reference string for the secret.
          type: boolean
        onetime:
          type: boolean
        expiration:
          type: string
          format: date-time
        total_payload_size:
          description: Total size in bytes of the encrypted payload.
          type: integer
          format: int64
      required:
        - recipient_ids
        - reference
        - total_payload_size
      type: object
    NewKey:
      properties:
        key_data:
          type: string
        thumbprint:
          type: string
        only:
          type: boolean
          default: false
        force:
          type: boolean
          default: false
        reference:
          type: string
    Key:
      properties:
        reference:
          type: string
        created_at:
          type: string
          format: date-time
        id:
          format: uuid
          type: string
        thumbprint:
          type: string
        key_data:
          type: string
      required:
        - tenant
        - key
      type: object
    Secret:
      properties:
        reference:
          type: string
        recipient:
          type: string
        sender:
          type: string
        sent_at:
          type: string
          format: date-time
        expiration:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
        onetime:
          type: boolean
        recipientKeyFingerprint:
          type: string
          nullable: true
      type: object
    Tenant:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        ref:
          type: string
      required:
        - name
        - ref
      type: object
    Token:
      description: A JWT token created by PigeonHole after the IdP ID Token has been excha
      properties:
        accessToken:
          type: string
          description: A JWT token
      required:
        - accessToken
      type: object
    User:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Key'
        email:
          type: string
        id:
          format: uuid
          type: string
        shortcode:
          type: string
      required:
        - username
    GeneralMessage:
      type: object
      properties:
        message:
          type: string
          nullable: true
        code:
          type: integer
          nullable: true
      required:
        - message

    QuotaExceededError:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Human-readable error message
        quota_type:
          type: string
          enum:
            - secrets_count
            - total_bytes
            - file_size
          description: Type of quota that was exceeded
        current_usage:
          type: integer
          format: int64
          description: Current usage for this quota type in bytes or count
        limit:
          type: integer
          format: int64
          description: Maximum allowed for this quota type
        requested:
          type: integer
          format: int64
          description: Requested size/count that would be added (applicable for bytes/file size)
      required:
        - code
        - message
        - quota_type
        - current_usage
        - limit

    name:
      type: object
      properties:
        property:
          type: integer
    CreateEphemeralUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email address for the ephemeral user
      required:
        - email
    CreateEphemeralUserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Key'
    AnalyticsResponse:
      type: object
      properties:
        secrets_sent:
          type: integer
          format: int64
        secrets_received:
          type: integer
          format: int64
        active_secrets_sent:
          type: integer
          format: int64
        max_secrets_quota:
          type: integer
          format: int64
        total_bytes_sent:
          type: integer
          format: int64
        max_bytes_quota:
          type: integer
          format: int64
    GeneralMessageWithAnalyticsResponse:
      allOf:
        - $ref: '#/components/schemas/GeneralMessage'
        - type: object
          properties:
            analytics:
              $ref: '#/components/schemas/AnalyticsResponse'
    UserCheckResponse:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email address checked
        exists:
          type: boolean
          description: Whether the user exists
      required:
        - email
        - exists
    SendInvitesResponse:
      type: object
      properties:
        message:
          type: string
          description: Status message
        sent_count:
          type: integer
          description: Number of invitations successfully queued
        failed_emails:
          type: array
          items:
            type: string
            format: email
          description: List of emails that failed to be invited
      required:
        - message
        - sent_count
        - failed_emails
    UsersListResponse:
      type: object
      properties:
        message:
          type: string
          description: Status message
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: List of authenticated users
      required:
        - message
        - users
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
paths:
  /auth/oidc/providers:
    get:
      tags:
        - Auth
      summary: List providers
      responses:
        '200':
          description: This generates a list of available OIDC providers
          $ref: '#/components/responses/GeneralMessageWithOIDCProvidersResponse'
        <<: *commonErrors
  /auth/oidc/handler/{provider}:
    post:
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCProviderToken'
        required: true
      responses:
        '201':
          description: This is where the cli will post the ID token from the OIDC provider
          $ref: '#/components/responses/GeneralMessageWithTokenResponse'
        <<: *commonErrors
      summary: Generic ID Token handler to be exchanged for a Pigeonhole token
  # /auth/oidc/handler/github:
  #   post:
  #     tags:
  #       - Auth
  #     requestBody:
  #       content:
  #         application/json:
  #           schema:
  #             $ref: '#/components/schemas/OIDCProviderToken'
  #       required: true
  #     responses:
  #       '201':
  #         description: This is where the cli will post the ID token from the OIDC provider
  #         $ref: '#/components/responses/GeneralMessageWithTokenResponse'
  #       <<: *commonErrors
  #     summary: Generic ID Token handler to be exchanged for a Pigeonhole token

  /secret:
    delete:
      tags:
        - Secret
      description: Delete all the users received secrets
      responses:
        '200':
          $ref: '#/components/responses/GeneralMessageResponse'
          description: Deletion of all users rececived secrets is successful
        <<: *commonErrors
      security:
        - BearerAuth: []

    get:
      description: Get my secrets
      parameters:
        - in: query
          name: reference
          required: false
          schema:
            type: string
        - in: query
          name: all
          required: false
          schema:
            type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GeneralMessageWithSecretsResponse'
          description: Retrieve secrets sent to user
        <<: *commonErrors
      security:
        - BearerAuth: []
      summary: Get my secrets
      tags:
        - Secret
    post:
      description: Generates a presigned url
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretEnvelopeOptions'
        required: true
      responses:
        '201':
          $ref: '#/components/responses/GeneralMessageWithSecretEnvelopeResponse'
        '406':
          $ref: '#/components/responses/GeneralMessageResponse'
        '413':
          $ref: '#/components/responses/QuotaExceededResponse'
        '429':
          $ref: '#/components/responses/QuotaExceededResponse'
        <<: *commonErrors
      security:
        - BearerAuth: []
      tags:
        - Secret
  /secret/{secret_id}:
    delete:
      tags:
        - Secret
      description: Delete a particular secret
      summary: Delete a particular secret
      parameters:
        - in: path
          name: secret_id
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GeneralMessageWithSecretResponse'
          description: Deletion of all users rececived secrets is successful
        <<: *commonErrors
      security:
        - BearerAuth: []
    get:
      description: Get a secret by id or reference
      parameters:
        - in: path
          name: secret_id
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GeneralMessageWithSecretResponse'
          description: Successfully retrieved items
        <<: *commonErrors
      security:
        - BearerAuth: []
      summary: Get secret by id or shortcode. This will include the presignedurl
      tags:
        - Secret
  /secret/{secret_id}/download:
    get:
      description: Redirects the request to the S3 presigned URL for download
      parameters:
        - in: path
          name: secret_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Redirect to the file's presigned url to securely download the file direct from S3
          $ref: '#/components/responses/GeneralMessageWithDownloadResponse'
        <<: *commonErrors
      security:
        - BearerAuth: []
      tags:
        - Secret
  /ping:
    get:
      description: Basic endpoint that tests auth and returns server info
      responses:
        '200':
          $ref: '#/components/responses/GeneralMessageWithServerInfoResponse'
          description: Successfully retrieved users
        <<: *commonErrors
      security:
        - BearerAuth: []
      summary: Retrieve all items from the given schema
  /user:
    get:
      description: Check if a user exists by email or retrieve a list of users
      parameters:
        - in: query
          name: email
          required: false
          schema:
            type: string
            format: email
          description: Single email to check user existence
        - in: query
          name: ephemeralkeys
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: User existence check or user list retrieval
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UserCheckResponse'
                  - $ref: '#/components/schemas/UsersListResponse'
        <<: *commonErrors
      security:
        - BearerAuth: []
      summary: Check user existence or retrieve users
      tags:
        - User
  /user/invite:
    post:
      description: Send invitation emails to recipients
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                recipients:
                  type: array
                  items:
                    type: string
                    format: email
                  minItems: 1
                  maxItems: 10
                  description: List of email addresses to invite
              required:
                - recipients
        required: true
      responses:
        '200':
          description: Invitations queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendInvitesResponse'
        <<: *commonErrors
      security:
        - BearerAuth: []
      summary: Send invitations to recipients
      tags:
        - User
  /user/me:
    get:
      description: Get my user object
      responses:
        '200':
          $ref: '#/components/responses/GeneralMessageWithUserResponse'
          description: Successfully retrieved items
        <<: *commonErrors
      security:
        - BearerAuth: []
      summary: Get my user object
      tags:
        - User
  /user/analytics:
    get:
      description: Get user analytics and usage statistics
      responses:
        '200':
          description: Successfully retrieved analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralMessageWithAnalyticsResponse'
        <<: *commonErrors
      security:
        - BearerAuth: []
      summary: Get user analytics and usage statistics
      tags:
        - User
  # /user/me/rotate-shortcode:
  #   post:
  #     description: Rotate users short code to remain anonymous
  #     responses:
  #       '204':
  #         description: Successfully rotated shortcode
  #       <<: *commonErrors
  #     security:
  #       - BearerAuth: []
  #     summary: Get my user object
  #     tags:
  #       - User
  /user/me/key:
    get:
      description: Get my user object
      responses:
        '200':
          $ref: '#/components/responses/GeneralMessageWithKeysResponse'
          description: Successfully retrieved items
        <<: *commonErrors
      security:
        - BearerAuth: []
      summary: Get my user object
      tags:
        - User
        - Key
    post:
      description: Create new keys
      responses:
        '201':
          $ref: '#/components/responses/Key'
          description: Successfully uploaded key
        <<: *commonErrors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewKey'
      security:
        - BearerAuth: []
      summary: Get my user object
      tags:
        - User
        - Key
  /user/me/key/validate/{thumbprint}:
    get:
      description: Get users key by thumbprint
      parameters:
        - in: path
          name: thumbprint
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved items
          $ref: '#/components/responses/GeneralMessageWithKeyResponse'
        <<: *commonErrors
      security:
        - BearerAuth: []
      summary: Get my user object
      tags:
        - User
        - Key
  /user/{user_id}/key/validate/{thumbprint}:
    get:
      description: Get users key by thumbprint
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
        - in: path
          name: thumbprint
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved items
        '404':
          description: No key found
        <<: *commonErrors
      security:
        - BearerAuth: []
      summary: Get my user object
      tags:
        - User
        - Key
  /user/{user_id}:
    get:
      description: Get users' keys
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved items
          $ref: '#/components/responses/User'
        <<: *commonErrors
      security:
        - BearerAuth: []
      summary: Get my user object
      tags:
        - User
  /user/{user_id}/key:
    get:
      description: Get users' keys
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Return a list of keys
          $ref: '#/components/responses/Keys'
        <<: *commonErrors
      security:
        - BearerAuth: []
      summary: Get my user object
      tags:
        - Key
        - User
    post:
      description: r
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewKey'
        required: true
      responses:
        '201':
          description: OK
      security:
        - BearerAuth: []
      tags:
        - Key
        - User
  /user/{user_id}/key/{key_id}:
    delete:
      description: r
      parameters:
        - in: path
          name: key_id
          required: true
          schema:
            type: string
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Key'
        required: true
      responses:
        '200':
          description: OK
        <<: *commonErrors
      security:
        - BearerAuth: []
      tags:
        - Key
        - User
    get:
      description: r
      parameters:
        - in: path
          name: key_id
          required: true
          schema:
            type: string
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Key'
        required: true
